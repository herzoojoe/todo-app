<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#4a7dfc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ToDo List">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>ToDo List <span id="today-date" class="today-date"></span></h1>

    <form id="todo-form" class="todo-form">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요" autocomplete="off">
      <button type="submit">추가</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">진행 중</button>
      <button class="filter-btn" data-filter="completed">완료</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <div class="footer-bar">
      <p id="todo-count" class="todo-count">0개 남음</p>
      <button id="clear-completed-btn" type="button" class="clear-completed-btn">완료된 항목 모두 지우기</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
